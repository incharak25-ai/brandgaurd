services:
  - type: web
    name: brandguard
    env: python
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r backend/requirements.txt"
    startCommand: "PYTHONPATH=. uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
